name: PluginSync
version: ${project.version}
main: dev.etran.PluginSyncPlugin
# 1.8-1.12 servers ignore this key; 1.13+ servers use it to skip legacy-plugin mode.
api-version: "1.13"
description: Detects plugin jars added to or removed from the plugins folder and loads/unloads just those, without reloading anything else.
author: PluginSync
commands:
  pluginsync:
    description: Sync plugin jars with the server, or enable/disable/restart/reload one plugin
    usage: /<command> [scan|sync|choose|update|enable|disable|restart|reload] [plugin] [-f]
    aliases: [psync]
    permission: pluginsync.use
permissions:
  pluginsync.use:
    description: Allows use of /pluginsync
    default: op
